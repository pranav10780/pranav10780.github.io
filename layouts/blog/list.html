{{ define "main" }}
  {{ .Content }}

  {{ if .Pages }}
    <table class="post-list" id="blog-post-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Title</th>
          <th>Tags</th>
        </tr>
      </thead>
      <tbody>
        {{ range .Pages }}
        <tr>
          <td class="post-list-date">{{ .Date.Format "2006-01-02" }}</td>
          <td><a href="{{ .Permalink }}">{{ .Title }}</a></td>
          <td>
            {{ range .Params.tags }}
              <span class="post-tag">{{ . }}</span>
            {{ end }}
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>

    <p id="blog-no-results" style="display:none;">No posts match your search.</p>

    <script>
    (function() {
      var input = document.getElementById('blog-search');
      var rows = document.querySelectorAll('#blog-post-table tbody tr');
      var noResults = document.getElementById('blog-no-results');
      input.addEventListener('input', function() {
        var query = input.value.toLowerCase().trim();
        var visibleCount = 0;
        rows.forEach(function(row) {
          var match = row.textContent.toLowerCase().includes(query);
          row.style.display = match ? '' : 'none';
          if (match) visibleCount++;
        });
        noResults.style.display = visibleCount === 0 ? '' : 'none';
      });
    })();
    </script>
  {{ else }}
    <p>No posts yet.</p>
  {{ end }}
{{ end }}
